<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小纸条 · 灵动岛</title>
    <style>
      :root {
        --bg: #0b0d14;
        --card: rgba(255, 255, 255, 0.045);
        --line: rgba(255, 255, 255, 0.09);
        --ink: #eaeef8;
        --muted: #8d95aa;
        --dim: #626b81;
        --accent: #8f7bff;
        --accent-soft: rgba(143, 123, 255, 0.16);
        --spring: cubic-bezier(0.32, 1.24, 0.42, 1);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(1200px 700px at 20% -10%, #1b1740 0%, transparent 60%),
          radial-gradient(900px 600px at 100% 0%, #12243a 0%, transparent 55%), var(--bg);
        color: var(--ink);
        font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      .app {
        width: min(880px, 100%);
        height: min(660px, calc(100vh - 64px));
        display: grid;
        grid-template-columns: 220px 1fr;
        background: rgba(14, 16, 24, 0.82);
        border: 1px solid var(--line);
        border-radius: 22px;
        overflow: hidden;
        backdrop-filter: blur(18px);
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55);
      }
      .side {
        border-right: 1px solid var(--line);
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
      .code-box {
        padding: 12px;
        border-radius: 12px;
        background: var(--accent-soft);
        border: 1px solid rgba(143, 123, 255, 0.3);
        font-family: ui-monospace, Consolas, monospace;
        letter-spacing: 1px;
        word-break: break-all;
        cursor: pointer;
        transition: transform 180ms var(--spring);
      }
      .code-box:active { transform: scale(0.98); }
      .code-box small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 0; margin-bottom: 4px; font-family: inherit; }
      .members { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
      .member { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
      .member i { width: 6px; height: 6px; border-radius: 50%; background: #454b5e; }
      .member.on i { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
      .member.me { color: var(--ink); }
      .spacer { flex: 1; }
      .main { display: flex; flex-direction: column; min-width: 0; }
      .head { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
      .head b { font-weight: 600; }
      .head .st { color: var(--muted); font-size: 12px; margin-left: auto; }
      .msgs { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
      .msg { display: flex; flex-direction: column; gap: 3px; max-width: 76%; animation: in 320ms var(--spring); }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } }
      .msg .who { font-size: 11px; color: var(--dim); }
      .bubble {
        padding: 8px 12px;
        border-radius: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.mine { align-self: flex-end; }
      .msg.mine .bubble { background: var(--accent-soft); border-color: rgba(143, 123, 255, 0.35); }
      .msg.mine .who { text-align: right; }
      .bubble img { max-width: 220px; max-height: 220px; border-radius: 10px; display: block; }
      .empty { margin: auto; color: var(--dim); text-align: center; font-size: 13px; }
      .composer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
      textarea {
        flex: 1;
        resize: none;
        height: 40px;
        padding: 9px 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
        color: var(--ink);
        font: inherit;
        outline: none;
      }
      textarea:focus { border-color: rgba(143, 123, 255, 0.5); }
      button {
        height: 40px;
        padding: 0 16px;
        border-radius: 12px;
        border: 1px solid rgba(143, 123, 255, 0.4);
        background: var(--accent-soft);
        color: #cfc6ff;
        font: inherit;
        cursor: pointer;
        transition: all 170ms var(--spring);
      }
      button:hover { background: rgba(143, 123, 255, 0.26); }
      button.ghost { background: transparent; border-color: var(--line); color: var(--muted); padding: 0 10px; }
      .gate { display: grid; place-items: center; flex: 1; padding: 24px; }
      .gate .box { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
      .gate h1 { font-size: 18px; margin: 0 0 4px; }
      .gate p { margin: 0; color: var(--muted); font-size: 12.5px; }
      input {
        height: 42px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
        color: var(--ink);
        font: inherit;
        outline: none;
        letter-spacing: 0.5px;
      }
      input.mono { font-family: ui-monospace, Consolas, monospace; letter-spacing: 2px; text-align: center; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      .tip { color: var(--dim); font-size: 11.5px; }
      .err { color: #ff8f8f; font-size: 12px; min-height: 18px; }
      .chk { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand"><span class="dot"></span> 小纸条</div>
        <div class="code-box" id="codeBox" hidden>
          <small>匹配码（点击复制）</small>
          <span id="codeText">-</span>
        </div>
        <div class="members" id="members"></div>
        <div class="spacer"></div>
        <button class="ghost" id="leaveBtn" hidden>退出这个群</button>
        <div class="tip" id="sideTip">一个匹配码最多 4 台设备</div>
      </aside>

      <section class="main">
        <div class="head">
          <b id="roomTitle">还没有加入</b>
          <span class="st" id="connState"></span>
        </div>

        <div class="gate" id="gate">
          <div class="box">
            <h1>用匹配码，一起传小纸条</h1>
            <p>把 12 位匹配码发给朋友，最多 4 台设备互通；消息永久保存在服务器上。</p>
            <input id="deviceName" placeholder="这台设备的名字（如 chenyuqing-life）" />
            <div class="row">
              <button id="createBtn">新建匹配码</button>
            </div>
            <div class="row">
              <input class="mono" id="joinCode" placeholder="XXXX XXXX XXXX" maxlength="16" />
              <button id="joinBtn">加入</button>
            </div>
            <label class="chk"><input type="checkbox" id="replaceChk" /> 我换了电脑，用新设备替换旧设备</label>
            <div class="err" id="err"></div>
          </div>
        </div>

        <div class="msgs" id="msgs" hidden></div>

        <div class="composer" id="composer" hidden>
          <button class="ghost" id="pickBtn" title="发送图片 / GIF">图</button>
          <textarea id="input" placeholder="写点什么，Ctrl + Enter 发送"></textarea>
          <button id="sendBtn">发送</button>
        </div>
        <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
      </section>
    </div>

    <script>
      const API = location.origin + '/island';
      const store = {
        get k() { return 'island-notebook.v1'; },
        load() { try { return JSON.parse(localStorage.getItem(this.k) || '{}'); } catch { return {}; } },
        save(v) { localStorage.setItem(this.k, JSON.stringify(v)); }
      };
      let sess = store.load();
      let sse = null;
      let lastAt = 0;
      const $ = (id) => document.getElementById(id);

      function deviceName() {
        return ($('deviceName').value || '').trim() || sess.deviceName || 'web-' + Math.random().toString(36).slice(2, 6);
      }

      async function api(path, opts = {}) {
        const r = await fetch(API + path, opts);
        return r.json();
      }
      const post = (path, body) =>
        api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

      function setErr(t) { $('err').textContent = t || ''; }

      async function create() {
        setErr('');
        const res = await post('/api/rooms', { deviceName: deviceName() });
        if (!res.ok) return setErr(res.message);
        adopt(res);
      }

      async function join() {
        setErr('');
        const code = $('joinCode').value.replace(/\s+/g, '');
        const res = await post('/api/rooms/join', {
          code,
          deviceName: deviceName(),
          replace: $('replaceChk').checked
        });
        if (!res.ok) return setErr(res.message);
        adopt(res);
      }

      function adopt(res) {
        sess = { ...sess, code: res.code, roomId: res.roomId, deviceId: res.deviceId, token: res.token, deviceName: res.deviceName };
        store.save(sess);
        enter();
      }

      function enter() {
        $('gate').hidden = true;
        $('msgs').hidden = false;
        $('composer').hidden = false;
        $('codeBox').hidden = false;
        $('leaveBtn').hidden = false;
        $('codeText').textContent = sess.code.replace(/(.{4})/g, '$1 ').trim();
        $('roomTitle').textContent = '匹配码 ' + sess.code.slice(0, 4) + '…';
        loadHistory();
        connect();
      }

      async function loadHistory() {
        const r = await api('/api/rooms/' + sess.roomId + '/messages?device=' + sess.deviceId + '&token=' + sess.token);
        if (!r.ok) return setErr(r.message);
        $('msgs').innerHTML = '';
        if (!r.messages.length) $('msgs').innerHTML = '<div class="empty">还没有纸条，说点什么吧</div>';
        r.messages.forEach(addMessage);
        scroll();
      }

      function addMessage(m, mineOverride) {
        const box = $('msgs');
        if (box.querySelector('[data-id="' + m.id + '"]')) return;
        box.querySelector('.empty')?.remove();
        const mine = mineOverride === undefined ? m.deviceId === sess.deviceId : mineOverride;
        const el = document.createElement('div');
        el.className = 'msg' + (mine ? ' mine' : '');
        el.dataset.id = m.id;
        const who = document.createElement('span');
        who.className = 'who';
        who.textContent = mine ? '我 · ' + time(m.at) : m.deviceName + ' · ' + time(m.at);
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (m.kind === 'text') bubble.textContent = m.text;
        else {
          const img = document.createElement('img');
          img.src = m.url;
          img.alt = '图片';
          bubble.appendChild(img);
        }
        el.append(who, bubble);
        box.appendChild(el);
        lastAt = Math.max(lastAt, m.at);
      }

      const time = (t) => new Date(t).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      const scroll = () => { const b = $('msgs'); b.scrollTop = b.scrollHeight; };

      function connect() {
        if (sse) sse.close();
        const url = API + '/api/stream?room=' + sess.roomId + '&device=' + sess.deviceId + '&token=' + encodeURIComponent(sess.token);
        sse = new EventSource(url);
        sse.addEventListener('hello', (e) => {
          $('connState').textContent = '已连接';
          roster(JSON.parse(e.data).members);
        });
        sse.addEventListener('presence', (e) => roster(JSON.parse(e.data).members));
        sse.addEventListener('members', (e) => roster(JSON.parse(e.data).members));
        sse.addEventListener('message', (e) => {
          addMessage(JSON.parse(e.data).message);
          scroll();
        });
        sse.addEventListener('kicked', (e) => {
          alert(JSON.parse(e.data).reason);
          leave();
        });
        sse.onerror = () => { $('connState').textContent = '重连中…'; };
      }

      function roster(list) {
        if (!list) return;
        $('members').innerHTML = list
          .map((m) => {
            const me = m.id === sess.deviceId ? ' me' : '';
            return '<div class="member' + (m.online ? ' on' : '') + me + '"><i></i>' + esc(m.name) + (me ? '（我）' : '') + '</div>';
          })
          .join('');
        $('sideTip').textContent = '已加入 ' + list.length + ' / 4 台设备';
      }

      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      async function sendText() {
        const text = $('input').value.trim();
        if (!text) return;
        $('input').value = '';
        const clientId = 'w' + Date.now() + Math.random().toString(36).slice(2, 7);
        const r = await post('/api/rooms/' + sess.roomId + '/messages', {
          deviceId: sess.deviceId, token: sess.token, kind: 'text', text, clientId
        });
        if (r.ok) { addMessage(r.message); scroll(); } else setErr(r.message);
      }

      async function sendImage(file) {
        const buf = await file.arrayBuffer();
        const up = await fetch(API + '/api/upload', { method: 'POST', headers: { 'Content-Type': file.type }, body: buf }).then((r) => r.json());
        if (!up.ok) return setErr(up.message);
        const kind = file.type === 'image/gif' ? 'image' : 'image';
        const r = await post('/api/rooms/' + sess.roomId + '/messages', {
          deviceId: sess.deviceId, token: sess.token, kind, mediaId: up.mediaId
        });
        if (r.ok) { addMessage(r.message); scroll(); } else setErr(r.message);
      }

      async function leave() {
        if (sess.roomId) await post('/api/rooms/' + sess.roomId + '/leave', { deviceId: sess.deviceId, token: sess.token });
        sess = { deviceId: sess.deviceId, deviceName: sess.deviceName };
        store.save(sess);
        if (sse) sse.close();
        location.reload();
      }

      $('createBtn').onclick = create;
      $('joinBtn').onclick = join;
      $('sendBtn').onclick = sendText;
      $('leaveBtn').onclick = () => confirm('确认退出这个群？') && leave();
      $('input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) sendText();
      });
      $('pickBtn').onclick = () => $('file').click();
      $('file').onchange = (e) => { if (e.target.files[0]) sendImage(e.target.files[0]); e.target.value = ''; };
      $('codeBox').onclick = async () => {
        await navigator.clipboard.writeText(sess.code);
        $('codeBox').querySelector('small').textContent = '已复制！';
        setTimeout(() => ($('codeBox').querySelector('small').textContent = '匹配码（点击复制）'), 1400);
      };

      $('deviceName').value = sess.deviceName || '';
      if (sess.roomId && sess.token) enter();
    </script>
  </body>
</html>
